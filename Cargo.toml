[package]
name = "remove_image_noise"
version = "0.1.0"
edition = "2024"
description = "PNG 透明背景脏像素自动清理工具"

[dependencies]
image = "0.25"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
opt-level = 3
